---
# Base image for the application build. Measured locally: alpine at 310 MB
# against 404 MB for slim, and npm ci needs no extra toolchain on either.
app_node_image: node:lts-alpine

# Host side of the port mapping. The container side is fixed by the
# application itself, which calls app.listen(3000).
app_port: 3000

app_repo_url: https://github.com/docker/getting-started-app.git
app_repo_version: main
